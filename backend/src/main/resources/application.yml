# =====================================================================
# Bloop - configuracion comun a todos los entornos.
# Los valores sensibles SIEMPRE llegan por variables de entorno.
# =====================================================================
spring:
  application:
    name: bloop
  profiles:
    default: dev
  config:
    # Lee las variables del fichero .env (raiz del proyecto o carpeta backend) si existe.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bloop}
    username: ${DB_USERNAME:bloop}
    password: ${DB_PASSWORD:}
  jpa:
    # Nunca dejamos que Hibernate cree o modifique tablas: el esquema es de Flyway.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Correo SMTP. Todo llega por variables de entorno (ver .env.example y docs/markdown/EMAIL.md).
  # Por defecto: Mailpit (localhost:1025 sin Docker para el backend, "mailpit" dentro de docker-compose).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
            required: ${MAIL_STARTTLS_ENABLE:false}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
          # Sin estos limites, un servidor que no responde bloquearia la peticion para siempre.
          connectiontimeout: ${MAIL_TIMEOUT_MS:10000}
          timeout: ${MAIL_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_TIMEOUT_MS:10000}
  servlet:
    multipart:
      # Un poco por encima del limite de la aplicacion (bloop.media.max-bytes), que es el que se valida.
      max-file-size: 6MB
      max-request-size: 7MB
  jackson:
    time-zone: UTC
    deserialization:
      # Jackson 3 falla por defecto si falta un campo primitivo (boolean, int). Lo desactivamos
      # para que un campo opcional ausente tome su valor por defecto (false / 0); Bean Validation
      # sigue validando los campos obligatorios.
      fail-on-null-for-primitives: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # El correo es opcional (Mailpit solo existe con Docker): no debe marcar la app como caida.
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

bloop:
  security:
    # Clave HMAC para firmar los JWT (minimo 32 caracteres). Obligatoria en produccion.
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
    # Clave HMAC para firmar el contenido de los QR de las entradas.
    qr-secret: ${QR_SECRET:}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    # Rotacion de claves: claves anteriores separadas por comas (solo validan, no firman).
    previous-jwt-secrets: ${JWT_PREVIOUS_SECRETS:}
    previous-qr-secrets: ${QR_PREVIOUS_SECRETS:}
    # Proteccion frente a fuerza bruta en el login.
    max-login-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  orders:
    # Minutos que se mantiene reservado el stock de un pedido pendiente de pago.
    pending-minutes: 15
  payments:
    # Proveedor de pago simulado (solo desarrollo). En produccion se usara Stripe.
    simulated-enabled: ${PAYMENTS_SIMULATED:false}
    stripe:
      # Se activa solo si hay clave secreta de test (sk_test_...). Ver docs/markdown/DEVELOPER_GUIDE.md
      enabled: ${STRIPE_ENABLED:false}
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
      webhook-tolerance-seconds: 300
      session-minutes: 30
  mail:
    # Si es false, los correos no se envian: se guardan en BD y se escriben en el log.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@bloop.local}
    from-name: ${MAIL_FROM_NAME:Bloop}
    reply-to: ${MAIL_REPLY_TO:}
  media:
    # local = carpeta de disco (desarrollo). cloudinary = almacenamiento en la nube (recomendado).
    provider: ${MEDIA_PROVIDER:local}
    max-bytes: ${MEDIA_MAX_BYTES:5242880}
    folder: ${MEDIA_FOLDER:bloop}
    # Fuera del proyecto: las imagenes no entran en Git ni en la imagen Docker.
    local-dir: ${MEDIA_LOCAL_DIR:${user.home}/.bloop/media}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
    cloudinary:
      cloud-name: ${MEDIA_CLOUDINARY_CLOUD_NAME:}
      api-key: ${MEDIA_CLOUDINARY_API_KEY:}
      api-secret: ${MEDIA_CLOUDINARY_API_SECRET:}
      api-base-url: ${MEDIA_CLOUDINARY_API_BASE_URL:https://api.cloudinary.com}
  demo-data:
    enabled: false
    password: ""
    history-days: 0
    dataset: kembo
  public-url: ${PUBLIC_URL:http://localhost:4200}
