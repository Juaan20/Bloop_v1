<vf-page-header [title]="id() ? (venue()?.name ?? 'Local') : 'Nuevo local'" [subtitle]="id() ? 'URL publica: /locales/' + (venue()?.slug ?? '') : 'Datos del establecimiento'">
  <a routerLink="/admin/locales" class="vf-btn-secondary">Volver</a>
</vf-page-header>

<form class="vf-card grid max-w-4xl gap-5 sm:grid-cols-2" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="sm:col-span-2">
    <label class="vf-label" for="name">Nombre</label>
    <input id="name" class="vf-input" formControlName="name" />
    <vf-field-error [control]="form.controls.name" [serverError]="serverErrors()['name']" />
  </div>
  <div class="sm:col-span-2">
    <label class="vf-label" for="description">Descripcion</label>
    <textarea id="description" rows="3" class="vf-input" formControlName="description"></textarea>
  </div>
  <div class="sm:col-span-2">
    <label class="vf-label" for="addressLine">Direccion</label>
    <input id="addressLine" class="vf-input" formControlName="addressLine" />
    <vf-field-error [control]="form.controls.addressLine" />
  </div>
  <div>
    <label class="vf-label" for="city">Ciudad</label>
    <input id="city" class="vf-input" formControlName="city" />
    <vf-field-error [control]="form.controls.city" />
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="vf-label" for="postalCode">C. postal</label>
      <input id="postalCode" class="vf-input" formControlName="postalCode" />
    </div>
    <div>
      <label class="vf-label" for="country">Pais</label>
      <input id="country" class="vf-input uppercase" maxlength="2" formControlName="country" />
      <vf-field-error [control]="form.controls.country" />
    </div>
  </div>
  <div>
    <label class="vf-label" for="phone">Telefono</label>
    <input id="phone" class="vf-input" formControlName="phone" />
  </div>
  <div>
    <label class="vf-label" for="email">Email de contacto</label>
    <input id="email" type="email" class="vf-input" formControlName="email" />
    <vf-field-error [control]="form.controls.email" />
  </div>
  <div>
    <label class="vf-label" for="capacity">Aforo maximo</label>
    <input id="capacity" type="number" min="1" class="vf-input" formControlName="capacity" />
    <vf-field-error [control]="form.controls.capacity" />
  </div>
  <div>
    <label class="vf-label" for="openingHours">Horario</label>
    <input id="openingHours" class="vf-input" placeholder="Jue-Sab 23:30-06:00" formControlName="openingHours" />
  </div>
  <div class="sm:col-span-2">
    <label class="vf-label" for="imageUrl">URL de imagen (opcional)</label>
    <input id="imageUrl" class="vf-input" placeholder="https://..." formControlName="imageUrl" />
    <vf-field-error [control]="form.controls.imageUrl" />
  </div>
  @if (id()) {
    <div>
      <label class="vf-label" for="status">Estado</label>
      <select id="status" class="vf-input" formControlName="status">
        <option value="ACTIVE">Activo</option>
        <option value="INACTIVE">Inactivo (oculto en la web)</option>
      </select>
    </div>
  }

  @if (error()) {
    <p class="rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-2 text-sm text-red-300 sm:col-span-2">{{ error() }}</p>
  }
  @if (canManage) {
    <div class="flex gap-3 sm:col-span-2">
      <button type="submit" class="vf-btn-primary" [disabled]="saving()">{{ saving() ? 'Guardando...' : 'Guardar' }}</button>
      <a routerLink="/admin/locales" class="vf-btn-ghost">Cancelar</a>
    </div>
  }
</form>

@if (id()) {
  <!-- Las salas, sus planos, mesas y reservas se gestionan todas desde el Plano VIP -->
  <section class="vf-card mt-6 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="font-display text-base font-semibold text-white">Salas, mesas y reservas VIP</h2>
      <p class="text-sm text-zinc-400">Crea las salas del local (principal, terraza, privada...), disena su plano y gestiona las reservas desde cada mesa.</p>
    </div>
    <a routerLink="/admin/vip" class="vf-btn-secondary">Abrir plano VIP</a>
  </section>
}
