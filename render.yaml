# Blueprint de Render: backend Spring Boot de Bloop construido con backend/Dockerfile.
# Render > New > Blueprint > elegir este repositorio. Las variables con "sync: false" se rellenan
# a mano en el panel de Render (nunca en este fichero). JWT_SECRET y QR_SECRET las genera Render.
services:
  - type: web
    # Servicio en Europa. Render no permite cambiar la region de un servicio existente: el antiguo
    # "bloop-backend" (Ohio) se sustituye por este y se borra a mano desde el panel de Render.
    name: bloop-backend-eu
    runtime: docker
    plan: free
    # Misma region que la base de datos de Neon (aws-eu-central-1, Frankfurt) y cerca de los usuarios.
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # --- Perfil y servidor ---
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      # El plan gratuito tiene 512 MB: limita la memoria de la JVM.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k"
      # --- Base de datos: Neon, conexion DIRECTA (DATABASE_URL_UNPOOLED, host SIN "-pooler").
      # El backend ya tiene su pool (HikariCP) y Flyway migra al arrancar: el pooler de Neon
      # (PgBouncer en modo transaccion) no sirve para migraciones ni estado de sesion.
      # De postgresql://USUARIO:CLAVE@HOST/neondb?sslmode=require&... salen las tres variables:
      #   DB_URL = jdbc:postgresql://HOST/neondb?sslmode=require   DB_USERNAME = USUARIO   DB_PASSWORD = CLAVE
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Pool pequeno que suelta las conexiones sin uso: asi Neon puede suspenderse (scale to zero)
      # y no se gastan las horas de computo del plan gratuito.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
        value: "60000"
      # --- Seguridad (minimo 32 caracteres; Render las genera al crear el servicio) ---
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      # --- URL publica del frontend (Vercel): enlaces de los correos y origen permitido ---
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # --- Correo SMTP ---
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_STARTTLS_ENABLE
        value: "true"
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Bloop
      # --- Imagenes: en la nube el disco del servidor se borra en cada despliegue ---
      - key: MEDIA_PROVIDER
        value: cloudinary
      - key: MEDIA_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: MEDIA_CLOUDINARY_API_KEY
        sync: false
      - key: MEDIA_CLOUDINARY_API_SECRET
        sync: false
      # --- Stripe en modo test (opcional; sin claves no hay pago online) ---
      - key: STRIPE_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
